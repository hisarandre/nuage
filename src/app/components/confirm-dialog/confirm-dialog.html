<div class="fixed inset-0 z-40 bg-black/80" (click)="onCancel()"></div>

<dialog open class="fixed left-1/2 top-1/2 z-50 m-0 w-full max-w-md -translate-x-1/2 -translate-y-1/2 rounded-2xl bg-background p-8 shadow-xl">
  <div (click)="$event.stopPropagation()">
    <h2 class="mb-2 text-2xl font-bold">{{ title() }}</h2>
    <p class="text-muted-foreground mb-8 text-sm">{{ message() }}</p>

    <div class="flex justify-end gap-3">
      <app-button variant="outline" (click)="onCancel()">
        {{ cancelLabel() }}
      </app-button>

      <app-button (click)="onConfirm()">
        {{ confirmLabel() }}
      </app-button>
    </div>
  </div>
</dialog>
