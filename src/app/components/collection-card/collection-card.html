<div class="pop-in">
  <a
  [routerLink]="['/collection', collection().id]"
  class="folder-card group block pt-3"
  [style]="'--card: ' + colorVar()"
  >
  <div class="flex h-36 flex-col justify-between p-5 relative">

    <app-edit-delete-button
      [itemId]="collection().id"
      (edit)="onEdit()"
      (delete)="onDelete()"
    />

    <span class="text-3xl">{{ collection().emoji }}</span>
    <h3 class="font-bold text-lg">{{ collection().name }}</h3>
  </div>
  </a>
</div>
